services:
  - type: web
    name: nka-moto-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CHASSIS_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
